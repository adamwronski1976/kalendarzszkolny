  <line x1="120" y1="348" x2="680" y2="348" stroke="#e2e5e9"/><text x="120" y="385" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#202124">Monday, 9 September</text>
  <text x="120" y="417" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#697386">LESSON PLAN</text><rect x="120" y="430" width="5" height="18" rx="2" fill="#009688"/><text x="140" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#202124">Polish language</text>
